name: Compilar Reportes LaTeX

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Practicas/**'
      - '.github/workflows/compilar-latex.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Practicas/**'

permissions:
  contents: read

jobs:
  build:
    name: Verificación Compilación ${{ matrix.practica }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        practica: [ "P1", "P2", "P3" ]

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Compilar reporte de ${{ matrix.practica }}
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: Practicas/${{ matrix.practica }}
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Subir PDF de ${{ matrix.practica }} como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Reporte-${{ matrix.practica }}
          path: Practicas/${{ matrix.practica }}/main.pdf
          if-no-files-found: error
